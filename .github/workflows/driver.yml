name: NeonRed Cable — Driver CI

on:
  push:
    paths:
      - 'neocable/**'
      - '.github/workflows/driver.yml'
  workflow_dispatch:

jobs:
  core:
    name: core (cargo test)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: neocable
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test Rust core
        run: cargo test --workspace
      - name: Enforce no warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

  driver:
    name: driver (hybrid KMDF build + test-sign)
    runs-on: windows-latest
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build no_std kernel staticlib
        working-directory: neocable
        run: cargo build --release --features kernel --target x86_64-pc-windows-msvc -p neocable-kernel

      - name: Confirm staticlib exists
        shell: pwsh
        run: |
          Test-Path "neocable\target\x86_64-pc-windows-msvc\release\neocable_kernel.lib"
          Get-Item "neocable\target\x86_64-pc-windows-msvc\release\neocable_kernel.lib" | Select-Object Length

      - name: Fetch WDK NuGet package
        shell: pwsh
        run: |
          $pkg = "$env:RUNNER_TEMP\wdknuget"
          New-Item -ItemType Directory -Force $pkg | Out-Null
          curl.exe -sSL -o "$pkg\wdk.nupkg" "https://api.nuget.org/v3-flatcontainer/microsoft.windows.wdk.x64/10.0.28000.2526/microsoft.windows.wdk.x64.10.0.28000.2526.nupkg"
          Write-Host "wdk nupkg size: $((Get-Item "$pkg\wdk.nupkg").Length)"
          Expand-Archive -Path "$pkg\wdk.nupkg" -DestinationPath "$pkg\microsoft.windows.wdk.x64\10.0.28000.2526"
          $c = "$pkg\microsoft.windows.wdk.x64\10.0.28000.2526\c"
          Write-Host "WDKContentRoot=$c"
          Write-Host "common.props exists: $(Test-Path "$c\build\10.0.28000.0\WindowsDriver.Common.props")"
          New-Item -ItemType Junction -Path "$c\Include\10.0" -Target "$c\Include\10.0.28000.0" -ErrorAction SilentlyContinue
          New-Item -ItemType Junction -Path "$c\Lib\10.0" -Target "$c\Lib\10.0.28000.0" -ErrorAction SilentlyContinue
          Write-Host "Include\10.0 exists: $(Test-Path "$c\Include\10.0\shared\sdkddkver.h")"
          "NRC_WDK_CONTENT=$c" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build KMDF driver
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            $msbuild = (& $vswhere -products * -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1)
          }
          if (-not $msbuild) {
            $msbuild = (Get-ChildItem -Path "C:\Program Files\Microsoft Visual Studio","C:\Program Files (x86)\Microsoft Visual Studio" -Filter MSBuild.exe -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.Directory.Name -eq "Bin" } | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          }
          if (-not $msbuild) { throw "MSBuild.exe not found" }
          Write-Host "MSBuild: $msbuild"
          $sdkTargets = "C:\Program Files\Microsoft Visual Studio\18\Enterprise\MSBuild\Microsoft\VC\v170\Microsoft.Cpp.WindowsSDK.targets"
          Write-Host "---- WindowsSDK.targets 20-60 ----"
          Get-Content $sdkTargets -ErrorAction SilentlyContinue | Select-Object -Skip 19 -First 42
          $sdkProps = "C:\Program Files\Microsoft Visual Studio\18\Enterprise\MSBuild\Microsoft\VC\v170\Microsoft.Cpp.WindowsSDK.props"
          Write-Host "---- WindowsSDK.props 1-70 ----"
          Get-Content $sdkProps -ErrorAction SilentlyContinue | Select-Object -First 70
          $wdkContent = $env:NRC_WDK_CONTENT
          Write-Host "WDKContentRoot: $wdkContent"
          $propsPath = "$wdkContent\build\10.0.28000.0\WindowsDriver.Common.props"
          Write-Host "common.props exists: $(Test-Path $propsPath)"
          if (-not $wdkContent -or -not (Test-Path $propsPath)) { throw "WDK package missing" }
          $wc = "$wdkContent\"
          $margs = @("/p:Configuration=Release", "/p:Platform=x64",
            "/p:WindowsSdkDir_10=$wc",
            "/p:WindowsSDKInstalled=true",
            "/p:WindowsSDK_Desktop_Support=true",
            "/p:WindowsSdkDir=$wc",
            "/p:WDKContentRoot=$wc",
            "/p:WDK_NuGet=true",
            "/p:WDKVersion=10.0.28000.0",
            "/p:NRCWdkDir=$wc\build\10.0.28000.0",
            "/verbosity:minimal")
          & $msbuild neocable\driver\neoredcable.vcxproj @margs
          if ($LASTEXITCODE -ne 0) { throw "msbuild failed exit=$LASTEXITCODE" }

      - name: Test-sign driver + export cert
        shell: pwsh
        run: |
          .\neocable\driver\scripts\test-sign.ps1
          Get-ChildItem neocable\driver\build\test-sign | Select-Object Name, Length

      - name: Upload driver package
        uses: actions/upload-artifact@v4
        with:
          name: neoredcable-test-signed
          path: neocable/driver/build/test-sign/**
          if-no-files-found: error