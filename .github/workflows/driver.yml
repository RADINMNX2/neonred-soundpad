name: NeonRed Cable — Driver CI

on:
  push:
    paths:
      - 'neocable/**'
      - '.github/workflows/driver.yml'
  workflow_dispatch:

jobs:
  core:
    name: core (cargo test)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: neocable
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test Rust core
        run: cargo test --workspace
      - name: Enforce no warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

  driver:
    name: driver (hybrid KMDF build + test-sign)
    runs-on: windows-latest
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build no_std kernel staticlib
        working-directory: neocable
        run: cargo build --release --features kernel --target x86_64-pc-windows-msvc -p neocable-kernel

      - name: Confirm staticlib exists
        shell: pwsh
        run: |
          Test-Path "neocable\target\x86_64-pc-windows-msvc\release\neocable_kernel.lib"
          Get-Item "neocable\target\x86_64-pc-windows-msvc\release\neocable_kernel.lib" | Select-Object Length

      - name: Install WDK (26100)
        shell: pwsh
        run: |
          winget install -e --id Microsoft.WindowsWDK.10.0.26100 `
            --accept-source-agreements --accept-package-agreements --disable-interactivity
          Write-Host "WDKContentRoot=$env:WDKContentRoot"
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\build" -ErrorAction SilentlyContinue | Select-Object Name

      - name: Build KMDF driver
        shell: pwsh
        env:
          WDKContentRoot: 'C:\Program Files (x86)\Windows Kits\10\'
        run: |
          Write-Host "##[group]toolchain discovery"
          Get-ChildItem "C:\Windows\System32\where.exe" | Out-Null
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          Write-Host "vswhere='$vswhere' exists=$(Test-Path $vswhere)"
          if (Test-Path $vswhere) {
            & $vswhere -products * -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe"
            & $vswhere -products * -property installationPath
          }
          Get-ChildItem -Path "C:\Program Files\Microsoft Visual Studio","C:\Program Files (x86)\Microsoft Visual Studio" -ErrorAction SilentlyContinue | Select-Object FullName
          [System.Environment]::GetEnvironmentVariable("PATH","Machine") -split ";" | Where-Object { $_ -match "MSBuild|VC" } | ForEach-Object { Write-Host "path-hit: $_" }
          Write-Host "##[endgroup]"
          if (Test-Path $vswhere) {
            $msbuild = (& $vswhere -products * -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1)
          }
          if (-not $msbuild) {
            $msbuild = (Get-ChildItem -Path "C:\Program Files\Microsoft Visual Studio","C:\Program Files (x86)\Microsoft Visual Studio" -Filter MSBuild.exe -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.Directory.Name -eq "Bin" } | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          }
          if (-not $msbuild) { throw "MSBuild.exe not found - see toolchain discovery output above" }
          Write-Host "MSBuild: $msbuild"
          $props = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\build" -Recurse -Filter "WindowsDriver.common.props" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          if ($props) {
            Write-Host "WDK common.props: $($props.FullName)"
            $nrcWdkDir = $props.DirectoryName
          } else {
            Write-Host "warning: WindowsDriver.common.props not found under WDK build dir (will try default path)"
            $nrcWdkDir = ""
          }
          $margs = @("/p:Configuration=Release", "/p:Platform=x64", "/p:WindowsTargetPlatformVersion=10.0.26100.0", "/verbosity:minimal")
          if ($nrcWdkDir) { $margs += "/p:NRCWdkDir=$nrcWdkDir" }
          & $msbuild neocable\driver\neoredcable.vcxproj @margs

      - name: Test-sign driver + export cert
        shell: pwsh
        run: |
          .\neocable\driver\scripts\test-sign.ps1
          Get-ChildItem neocable\driver\build\test-sign | Select-Object Name, Length

      - name: Upload driver package
        uses: actions/upload-artifact@v4
        with:
          name: neoredcable-test-signed
          path: neocable/driver/build/test-sign/**
          if-no-files-found: error