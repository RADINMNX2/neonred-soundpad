<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="bg_grad" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
<stop stop-color="#18181b"/>
<stop offset="1" stop-color="#09090b"/>
</linearGradient>
<linearGradient id="neon_grad" x1="256" y1="128" x2="256" y2="384" gradientUnits="userSpaceOnUse">
<stop stop-color="#EF4444"/>
<stop offset="1" stop-color="#BE123C"/>
</linearGradient>
<filter id="glow_filter" x="112" y="112" width="288" height="288" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
<feFlood flood-opacity="0" result="BackgroundImageFix"/>
<feBlend mode="normal" in="SourceGraphic" in2="BackgroundImageFix" result="shape"/>
<feGaussianBlur stdDeviation="16" result="effect1_foregroundBlur"/>
</filter>
<linearGradient id="stroke_grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
<stop stop-color="#3f3f46"/>
<stop offset="1" stop-color="#18181b"/>
</linearGradient>
</defs>

<!-- Main Container (Squircle) -->
<rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bg_grad)" stroke="url(#stroke_grad)" stroke-width="6"/>

<!-- Outer Ring Glow -->
<circle cx="256" cy="256" r="140" stroke="#EF4444" stroke-width="2" stroke-opacity="0.2" stroke-dasharray="10 10"/>

<!-- Central Neon Glow (Blur) -->
<circle cx="256" cy="256" r="90" fill="url(#neon_grad)" filter="url(#glow_filter)" fill-opacity="0.8"/>

<!-- Central Pad Circle -->
<circle cx="256" cy="256" r="85" fill="url(#neon_grad)"/>

<!-- Microphone Icon -->
<path d="M256 300C271.464 300 284 287.464 284 272V208C284 192.536 271.464 180 256 180C240.536 180 228 192.536 228 208V272C228 287.464 240.536 300 256 300Z" fill="white"/>
<path d="M304 272C304 298.51 282.51 320 256 320C229.49 320 208 298.51 208 272H198C198 301.623 220.129 326.066 249 329.584V350H263V329.584C291.871 326.066 314 301.623 314 272H304Z" fill="white"/>

<!-- Sound Equalizer Bars -->
<!-- Left -->
<rect x="150" y="236" width="10" height="40" rx="5" fill="#EF4444"/>
<rect x="120" y="216" width="10" height="80" rx="5" fill="#991B1B"/>
<!-- Right -->
<rect x="352" y="236" width="10" height="40" rx="5" fill="#EF4444"/>
<rect x="382" y="216" width="10" height="80" rx="5" fill="#991B1B"/>

<!-- Top Glossy Reflection -->
<path d="M60 140C60 140 170 50 256 50C342 50 452 140 452 140V120C452 80 400 40 360 40H152C112 40 60 80 60 120V140Z" fill="white" fill-opacity="0.08"/>

</svg>